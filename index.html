<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f8;--card:#fff;--tx:#14202e;--mu:#667386;--nv:#111;--gd:#d4a62a;--ac:#8c6a00;--bd:#e3e7ee;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#1a212b;--tx:#edf0f5;--mu:#98a3b3;--nv:#3a2d0a;--ac:#e0b83c;--bd:#2a3340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--card:#1a212b;--tx:#edf0f5;--mu:#98a3b3;--nv:#3a2d0a;--ac:#e0b83c;--bd:#2a3340;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:78px}
.hero{background:linear-gradient(160deg,#000,#2b2208);color:#fff;padding:26px 18px 30px;text-align:center}
.logo{display:inline-block;border:2px solid var(--gd);color:var(--gd);border-radius:12px;padding:4px 14px;font-weight:800;letter-spacing:2px;font-size:22px}
.hero h1{margin:12px 0 4px;font-size:22px}.hero p{margin:0;opacity:.92;font-style:italic;color:#f1dd8b}
.hero .sub{margin-top:8px;font-size:14px;opacity:.85;font-style:normal;color:#fff}
main{padding:14px;max-width:680px;margin:auto}
h2{font-size:18px;margin:18px 0 10px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:13px}
.steps div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 4px}.steps b{display:block;font-size:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid .card{padding:0;overflow:hidden;margin:0;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;width:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,var(--bd),var(--bg))}
.pb{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}.pb b{font-size:14px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 14px;white-space:nowrap;font:inherit;cursor:pointer}
.chip.on{background:var(--nv);color:#fff;border-color:var(--nv)}
.btn{display:block;text-align:center;text-decoration:none;font:inherit;cursor:pointer;background:var(--nv);color:#fff;border:0;border-radius:10px;padding:11px 14px;width:100%;margin-top:8px;font-weight:600}
.btn.gold{background:var(--gd);color:#1d1600}.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.sm{margin-top:auto;padding:8px}
input,select,textarea{width:100%;font:inherit;padding:11px;margin-top:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.mu{color:var(--mu);font-size:13px}.price{font-weight:700;color:var(--ac)}.tag{font-size:12px;border-radius:6px;padding:2px 8px;border:1px solid var(--bd)}
.pick{display:block;text-align:center;border:2px dashed var(--gd);border-radius:12px;padding:16px;margin-top:8px;cursor:pointer;color:var(--tx)}
.pick img{max-width:100%;max-height:160px;border-radius:8px;display:block;margin:0 auto 6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:11px 4px;background:none;border:0;color:var(--mu);font:inherit;font-size:13px;cursor:pointer}nav button b{display:block;font-size:20px}nav button.on{color:var(--ac);font-weight:700}
.wa{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;border-radius:30px;padding:11px 16px;text-decoration:none;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.25)}
footer{text-align:center;color:var(--mu);font-size:13px;padding:18px}
</style>

const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let local=ls.get("niz_orders",[]);
$("#wa").href="https://wa.me/"+CFG.wa+"?text="+encodeURIComponent("Bonjour NIZ Dropshipping, j’ai une question.");
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));$("#app").innerHTML=tab==="cat"?vCat():tab==="cart"?vCart():tab==="gal"?vGal():vContact();scrollTo(0,0)}
function vCat(){
 const cats=["Tous",...new Set(PRODUITS.map(p=>p.c))];
 return `<h2>Comment ça marche</h2><div class="steps"><div><b>🛍️</b>Choisissez</div><div><b>💳</b>Payez par Mobile Money</div><div><b>🚚</b>Recevez</div></div><div class="mu" style="text-align:center;margin-top:10px">✔ Produits de qualité · ✔ Livraison rapide · ✔ Paiement sécurisé avant la livraison · ✔ Satisfaction garantie</div><h2>Notre catalogue</h2><div class="chips">${cats.map(c=>`<button class="chip ${c===cat?"on":""}" onclick="cat='${c}';render()">${c}</button>`).join("")}</div><div class="grid">`+
 (PRODUITS.filter(p=>cat==="Tous"||p.c===cat).map(p=>`<div class="card">${p.img?`<img class="ph" src="${p.img}" alt="${esc(p.n)}">`:`<div class="ph">${ICO[p.c]||"📦"}</div>`}<div class="pb"><b>${esc(p.n)}</b><span class="mu">${esc(p.c)}</span><span class="price">${p.p?fmt(p.p):"Prix sur demande"}</span>${p.p?`<button class="btn sm" onclick="add('${p.id}')">Ajouter${cart[p.id]?" ("+cart[p.id]+")":""}</button>`:`<a class="btn sm gold" target="_blank" rel="noopener" href="https://wa.me/${CFG.wa}?text=${encodeURIComponent("Bonjour, quel est le prix de : "+p.n+" ?")}">Demander le prix</a>`}</div></div>`).join("")||`<div class="card mu" style="padding:12px;grid-column:1/-1">Aucun produit pour l’instant.</div>`)+`</div>`+team()+vReq();
}
function yt(u){const m=String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:""}
function vGal(){
 const it=PUBS.map(p=>{
  if(p.type==="photo")return `<div class="card" style="padding:0;overflow:hidden"><img src="${esc(p.img)}" alt="${esc(p.titre)}" style="width:100%;display:block"><div style="padding:10px"><b>${esc(p.titre)}</b></div></div>`;
  const id=yt(p.url||""),ok=/^https?:\/\//.test(p.url||"");
  return `<div class="card" style="padding:0;overflow:hidden">${id?`<iframe src="https://www.youtube.com/embed/${id}" style="width:100%;aspect-ratio:16/9;border:0" allowfullscreen loading="lazy"></iframe>`:`<div class="ph" style="aspect-ratio:16/9">🎬</div>`}<div style="padding:10px"><b>${esc(p.titre)}</b>${!id&&ok?`<a class="btn gold" target="_blank" rel="noopener" href="${esc(p.url)}">Voir la vidéo</a>`:""}</div></div>`}).join("");
 return `<h2>Nos publicités et actualités</h2><a class="btn gold" target="_blank" rel="noopener" href="${TT}" style="margin:0 0 12px">🎵 Suivez-nous sur TikTok</a>`+(it||`<div class="card mu">Nos vidéos et photos arrivent bientôt.</div>`)+team();
}
function vContact(){return `<h2>Une question ou une réclamation ?</h2><div class="card"><div class="mu">Écrivez-nous : nous répondons rapidement sur WhatsApp.</div><input id="cn" placeholder="Votre nom"><input id="ct" type="tel" placeholder="Votre téléphone"><select id="cs"><option>Réclamation</option><option>Question</option><option>Suivi de commande</option><option>Suggestion</option><option>Collaboration / partenariat</option></select><textarea id="cm" rows="4" placeholder="Votre message"></textarea><label class="pick">📷 <b>Ajouter une photo (facultatif)</b><div class="mu" id="cfn">${ctFiles.length?ctFiles.length+" photo(s) choisie(s)":"Aucune photo choisie"}</div><input type="file" accept="image/*" multiple hidden onchange="ctFiles=[...this.files];$('#cfn').textContent=ctFiles.length+' photo(s) choisie(s)'"></label><button class="btn gold" onclick="sendCt()">Envoyer sur WhatsApp</button></div><div class="card"><b>Nous joindre</b><div class="mu">Appels : <a href="tel:+22871086235">71 08 62 35</a> · <a href="tel:+22891375478">91 37 54 78</a> · <a href="tel:+22896096964">96 09 69 64</a></div><div class="mu">Tchamba, Togo · Livraison possible partout au Togo</div><a class="btn alt" target="_blank" rel="noopener" href="${TT}">🎵 TikTok @niz_dropshinpping</a></div>`}
function sendCt(){const m=$("#cm").value.trim();if(!m){alert("Écrivez votre message.");return}ev("message_client");shareWA("Bonjour NIZ Dropshipping.\nType : "+$("#cs").value+"\nNom : "+$("#cn").value+"\nTél : "+$("#ct").value+"\nMessage : "+m,ctFiles)}
function add(id){ev("ajout_panier");cart[id]=(cart[id]||0)+1;render()}
function rem(id){cart[id]--;if(!cart[id])delete cart[id];render()}
function total(){return PRODUITS.reduce((s,p)=>s+(cart[p.id]||0)*p.p,0)}
function vReq(){return `<h2>Vous cherchez autre chose ?</h2><div class="card"><div class="mu">Envoyez-nous la photo du produit voulu : nous vous répondons avec le prix.</div><label class="pick">📷 <b>Touchez pour choisir une photo</b><div class="mu" id="rqn">${reqFiles.length?reqFiles.length+" photo(s) choisie(s)":"Aucune photo choisie"}</div><input type="file" accept="image/*" multiple hidden onchange="reqFiles=[...this.files];$('#rqn').textContent=reqFiles.length+' photo(s) choisie(s)'"></label><textarea id="rq" rows="2" placeholder="Décrivez ce que vous voulez (taille, couleur, quantité…)"></textarea><button class="btn gold" onclick="sendReq()">Envoyer ma demande sur WhatsApp</button></div>`}
async function shareWA(t,files){
 if(files.length&&navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files,text:t});return}catch(e){if(e.name==="AbortError")return}}
 window.open("https://wa.me/"+CFG.wa+"?text="+encodeURIComponent(t),"_blank");
 if(files.length)alert("Dans WhatsApp, joignez votre photo au message (icône trombone).");
}
function sendReq(){const t=($("#rq")||{}).value||"";if(!t&&!reqFiles.length){alert("Ajoutez une photo ou une description.");return}ev("demande_prix");shareWA("Bonjour NIZ Dropshipping, pouvez-vous me donner le prix de ce produit ? "+t,reqFiles)}
function vCart(){
 const ids=Object.keys(cart);
 if(msg)return `<h2>Commande</h2><div class="card">${msg}<button class="btn alt" onclick="msg='';tab='cat';render()">Retour au catalogue</button></div>`;
 if(!ids.length)return `<h2>Mon panier</h2><div class="card mu">Votre panier est vide. Ajoutez des produits depuis le catalogue.</div>`+vReq();
 return `<h2>Mon panier</h2>`+ids.map(id=>{const p=PRODUITS.find(x=>x.id===id);return `<div class="card row"><div><b>${esc(p.n)}</b><div class="mu">${fmt(p.p)}</div></div><div><button class="chip" onclick="rem('${id}')">−</button> ${cart[id]} <button class="chip" onclick="add('${id}')">+</button></div></div>`}).join("")+
 `<div class="card"><div class="row"><b>Total</b><span class="price">${fmt(total())}</span></div>
 <input id="nom" placeholder="Votre nom"><input id="tel" type="tel" placeholder="Votre téléphone"><input id="adr" placeholder="Lieu de livraison (ville, quartier)">
 <select id="pay"><option>Mobile Money Flooz</option>${CFG.tmoney?"<option>Mobile Money T-Money</option>":""}<option>Paiement à la livraison</option></select>
 <textarea id="note" rows="2" placeholder="Précisions (taille, couleur…)"></textarea>
 <button class="btn gold" onclick="send()">Commander via WhatsApp</button></div>`;
}
async function send(){
 const nom=$("#nom").value.trim(),tel=$("#tel").value.trim(),adr=$("#adr").value.trim();
 if(!nom||!tel||!adr){alert("Merci de remplir nom, téléphone et lieu de livraison.");return}
 const items=Object.keys(cart).map(id=>{const p=PRODUITS.find(x=>x.id===id);return cart[id]+" × "+p.n}).join("; ");
 const o={client:nom,tel,adresse:adr,articles:items,total:total(),paiement:$("#pay").value,note:$("#note").value,statut:"Nouvelle",payé:false,date:new Date().toISOString().slice(0,10)};
 try{if(db)await db.collection("orders").add(o)}catch(e){}
 const t=`Bonjour NIZ Dropshipping, je commande :\n${items}\nTotal : ${fmt(o.total)}\nNom : ${nom}\nTél : ${tel}\nLivraison : ${adr}\nPaiement : ${o.paiement}${o.note?"\nNote : "+o.note:""}`;
 const num=o.paiement.includes("Flooz")?CFG.flooz:o.paiement.includes("T-Money")?CFG.tmoney:"91 22 71 47";
 msg=`<b>Commande prête ✔</b><p>Envoyez-la sur WhatsApp pour que nous la confirmions.</p>${num?`<p>Pour payer, envoyez <b>${fmt(o.total)}</b> par ${o.paiement.replace("Mobile Money ","")} au <b>${num}</b>, puis envoyez-nous la capture de la transaction.</p>`:""}<a class="btn gold" href="https://wa.me/${CFG.wa}?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">Ouvrir WhatsApp</a>`;
 ev("commande_whatsapp");cart={};render();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();
fetch("produits.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{PRODUITS=j;render()}).catch(()=>{});
fetch("pubs.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{PUBS=j;if(tab==="gal")render()}).catch(()=>{});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
